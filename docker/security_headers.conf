# Empêche le navigateur de deviner le type MIME (protection contre XSS via upload)
add_header X-Content-Type-Options "nosniff" always;

# Empêche l'affichage du site dans une iframe (protection contre le Clickjacking)
add_header X-Frame-Options "SAMEORIGIN" always;

# Filtre XSS (bien que déprécié au profit de CSP, reste une bonne pratique legacy)
add_header X-XSS-Protection "1; mode=block" always;

# Force l'utilisation du HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Politique de Sécurité du Contenu (CSP)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:;" always;

# Permissions-Policy (Version propre sans l'erreur browsing-topics)
# On définit uniquement ce qui est standard.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;