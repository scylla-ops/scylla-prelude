[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["json", "multipart"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "fs"] }
tower-http = { version = "0.6.8", features = ["fs", "compression-full", "trace", "request-id", "set-header", "cors"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
tracing = "0.1.44"
dotenvy = "0.15.7"
tower = "0.5.3"
surrealdb = { version = "3", features = ["kv-rocksdb"] }
surrealdb-types = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rss = "2"
pulldown-cmark = "0.12"
imagesize = "0.14.0"

[dev-dependencies]
axum-test = "17"
surrealdb = { version = "3", features = ["kv-mem"] }
