[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["fs", "compression-full", "trace", "request-id", "set-header"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
tracing = "0.1.44"
dotenvy = "0.15.7"
tower = "0.5.3"